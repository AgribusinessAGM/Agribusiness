<!doctype html>
<html lang="es">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="app/styles.css">
    <!-- Sin compilación: el navegador carga los módulos de app/ directamente.
         React y htm están guardados en assets/vendor/ (no se descargan de internet). -->
    <script type="importmap">
      {
        "imports": {
          "react": "./assets/vendor/react.js",
          "react-dom": "./assets/vendor/react-dom.js",
          "react-dom/client": "./assets/vendor/react-dom-client.js",
          "htm": "./assets/vendor/htm.js"
        }
      }
    </script>
    <script type="module" src="app/main.js"></script>
  </head>

    <div id="root"></div>
  </body>
</html>
